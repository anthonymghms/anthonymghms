name: debug
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.METRICS_TOKEN }}
        run: |
          curl -s -H "Authorization: bearer $T" -X POST https://api.github.com/graphql \
            -d '{"query":"{ user(login:\"anthonymghms\") { contributionsCollection { commitContributionsByRepository(maxRepositories: 100) { repository { primaryLanguage { name } } contributions { totalCount } } totalCommitContributions } repositories(first: 100, ownerAffiliations: OWNER) { nodes { stargazerCount } } } }"}' | jq -c '.errors, (.data.user != null)'
