name: profile

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile

jobs:
  skyline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Start GraphQL proxy
        env:
          BASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_TOKEN: ${{ secrets.METRICS_TOKEN }}
          ORG_IDS: MDEyOk9yZ2FuaXphdGlvbjEzNjc1NjYy,O_kgDOEXVOOA
          ORG_LOGINS: CapSens,Gambit-Agents,sudo-byte-dev
        run: |
          node scripts/graphql-proxy.mjs > proxy.log 2>&1 &
          sleep 1

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ENDPOINT: http://localhost:8787
          USERNAME: ${{ github.repository_owner }}

      - run: cat proxy.log

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --staged --quiet || git commit -m "Update 3D contributions"
          git pull --rebase
          git push
